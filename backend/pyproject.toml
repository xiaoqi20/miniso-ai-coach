[project]
name = "shouke-backend"
version = "0.1.0"
description = "MINISO 门店培训 M1 后端底座"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "SQLAlchemy[asyncio]>=2.0.36",
  "aiomysql>=0.2.0",
  "PyMySQL>=1.1.1",
  "alembic>=1.14",
  "python-ulid>=3.0.0",
  "cryptography>=44.0.0",
  "langgraph>=1.0.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"
